<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14466b" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="سه‌تقویم" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>سه‌تقویم</title>
    </head>
  <body>
    <div id="root"></div>
  
<style>
  #lock { position: fixed; inset: 0; display: grid; place-items: center; background: #f1f4f5; font-family: -apple-system, system-ui, sans-serif; color: #1b2a33; padding: 24px; }
  #lock form { width: min(320px, 100%); display: flex; flex-direction: column; gap: 12px; text-align: center; }
  #lock img { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 4px; }
  #lock h1 { font-size: 1.15rem; margin: 0; font-weight: 600; }
  #lock input { font: inherit; font-size: 1.05rem; padding: 12px 14px; border-radius: 12px; border: 1px solid #c9d3d8; background: #fff; color: inherit; text-align: center; }
  #lock button { font: inherit; font-size: 1rem; padding: 12px; border-radius: 12px; border: 0; background: #14466b; color: #fff; }
  #lock button:disabled { opacity: .6; }
  #lock p { margin: 0; min-height: 1.4em; color: #b3261e; font-size: .9rem; }
  @media (prefers-color-scheme: dark) {
    #lock { background: #0f1519; color: #e3eaee; }
    #lock input { background: #182127; border-color: #2c3a42; }
  }
</style>
<div id="lock" hidden>
  <form autocomplete="off">
    <img src="./apple-touch-icon.png" alt="">
    <h1>رمز ورود · Password</h1>
    <input id="lock-pw" type="password" autocomplete="current-password" aria-label="Password" autofocus>
    <button type="submit">باز کردن · Unlock</button>
    <p id="lock-msg" role="alert"></p>
  </form>
</div>
<script>
(function () {
  var SALT = 'rw2x2HdDmUrliYASET1HfA==', ITER = 310000, FILE = './assets/app-27cce01f6d.bin', KEY = 'se-taqvim:unlock';
  var dec = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var enc = function (u) { var s = ''; u.forEach(function (b) { s += String.fromCharCode(b); }); return btoa(s); };
  if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('./sw.js').catch(function () {});
  var data = fetch(FILE).then(function (r) { if (!r.ok) throw new Error('load'); return r.arrayBuffer(); });

  function open(rawKey) {
    return Promise.all([crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']), data]).then(function (a) {
      var buf = new Uint8Array(a[1]);
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, a[0], buf.slice(12));
    }).then(function (plain) {
      var app = JSON.parse(new TextDecoder().decode(plain));
      var st = document.createElement('style'); st.textContent = app.css; document.head.appendChild(st);
      document.getElementById('lock').remove();
      var url = URL.createObjectURL(new Blob([app.js], { type: 'text/javascript' }));
      var s = document.createElement('script'); s.type = 'module'; s.src = url; document.body.appendChild(s);
      return true;
    });
  }
  function derive(pw) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']).then(function (k) {
      return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: dec(SALT), iterations: ITER, hash: 'SHA-256' }, k, 256);
    });
  }
  function ask() {
    var lock = document.getElementById('lock'), form = lock.querySelector('form'), input = document.getElementById('lock-pw'), msg = document.getElementById('lock-msg');
    lock.hidden = false; input.focus();
    form.onsubmit = function (e) {
      e.preventDefault();
      var btn = form.querySelector('button'); btn.disabled = true; msg.textContent = '';
      derive(input.value).then(function (raw) {
        return open(raw).then(function () { try { localStorage.setItem(KEY, enc(new Uint8Array(raw))); } catch (x) {} });
      }).catch(function (err) {
        btn.disabled = false; input.select();
        msg.textContent = err && err.message === 'load' ? 'برنامه بارگیری نشد؛ اینترنت را بررسی کن. · Could not load.' : 'رمز درست نیست. · Wrong password.';
      });
    };
  }
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (x) {}
  if (saved) open(dec(saved)).catch(function () { try { localStorage.removeItem(KEY); } catch (x) {} ask(); });
  else ask();
})();
</script>
</body>
</html>
